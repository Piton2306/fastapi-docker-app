name: My first Pipeline

#1. КОГДА: при пуше в main
on:
  push:
    branches: ["main"]
# Безопасность: выдаём права на запись пакетов в реестр
permissions:
  contents: read
  packages: write

#2. ЧТО ДЕЛАТЬ: список задач
jobs:
  test-job:
    runs-on: ubuntu-latest #ГДЕ: на чистом Ubuntu в облаке
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Установка зависимостей разработки
        run: pip install -r requirements-dev.txt


      - name: 4. Проверка качества кода (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5.Запуск автотестов (pytest)
        run: python -m pytest -v   


  # ==========================================
  # ЭТАП 2: Сборка и публикация в Registry
  # ==========================================

  build-and-push:
    needs: test-job # Запускать только если прошли тесты
    runs-on: ubuntu-latest
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 2. Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 3. Сборка и публикация Docker-образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/piton2306/fastapi-docker-app:latest
            ghcr.io/piton2306/fastapi-docker-app:${{ github.sha }}