name: My first Pipeline

#1. КОГДА: при пуше в main
on:
  push:
    branches: ["main"]

#2. ЧТО ДЕЛАТЬ: список задач
jobs:
  test-job:
    runs-on: ubuntu-latest #ГДЕ: на чистом Ubuntu в облаке
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка линтера flake8
        run: pip install flake8

      - name: 3. Проверка качества кода Python
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
   